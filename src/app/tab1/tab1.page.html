<ion-header class="ion-no-border">
  <ion-toolbar class="navbar-rosa">
    <!-- Buscador al lado izquierdo -->
    <ion-searchbar
      slot="start"
      placeholder="Buscar amigos..."
      class="buscador-rosa">
    </ion-searchbar>

    <!-- Íconos al lado derecho -->
    <ion-buttons slot="end">
      <!-- Símbolo de cámara con un más para subir fotos -->
      <ion-button class="btn-icono" title="Subir foto">
        <div class="camara-con-mas">
          <ion-icon name="camera-outline" class="icono-principal"></ion-icon>
          <ion-icon name="add-circle" class="icono-mas"></ion-icon>
        </div>
      </ion-button>

      <!-- Símbolo de álbum -->
      <ion-button class="btn-icono" title="Mi Álbum">
        <ion-icon name="images-outline" class="icono-principal"></ion-icon>
      </ion-button>

      <!-- Botón de perfil que abre el Dropdown -->
      <ion-button id="menu-perfil-trigger" class="btn-icono" title="Cuenta">
        <ion-icon name="person-circle-outline" class="icono-perfil"></ion-icon>
      </ion-button>
    </ion-buttons>

    <!-- Menú Dropdown (Popover) para Inicio de sesión y Registro -->
    <ion-popover trigger="menu-perfil-trigger" triggerAction="click" dismissOnSelect="true">
      <ng-template>
        <ion-content class="popover-rosa">
          <ion-list lines="none">
            <ion-item button>
              <ion-icon name="log-in-outline" slot="start" color="danger"></ion-icon>
              <ion-label>Inicio de sesión</ion-label>
            </ion-item>
            <ion-item button>
              <ion-icon name="person-add-outline" slot="start" color="danger"></ion-icon>
              <ion-label>Registro</ion-label>
            </ion-item>
          </ion-list>
        </ion-content>
      </ng-template>
    </ion-popover>
  </ion-toolbar>
</ion-header>

<ion-content class="fondo-rosa">
  <!-- Título principal -->
  <div class="contenedor-titulo">
    <h1 class="titulo-momentos">MOMENTOS DE HOY</h1>
  </div>

  <!-- Grilla de momentos de amigos (2 columnas en móvil, 4 en pantalla grande) -->
  <ion-grid>
    <ion-row>
      <!-- Tarjeta 1: Pepita -->
      <ion-col size="6" size-md="3">
        <ion-card class="tarjeta-momento">
          <ion-item lines="none" class="cabecera-usuario">
            <ion-avatar slot="start" class="avatar-usuario">
              <img src="https://ionicframework.com" alt="Pepita" />
            </ion-avatar>
            <ion-label class="nombre-usuario">Pepita</ion-label>
          </ion-item>
          <div class="contenedor-foto">
            <img src="https://picsum.photos" alt="Momento de Pepita" />
          </div>
        </ion-card>
      </ion-col>

      <!-- Tarjeta 2: Jorge -->
      <ion-col size="6" size-md="3">
        <ion-card class="tarjeta-momento">
          <ion-item lines="none" class="cabecera-usuario">
            <ion-avatar slot="start" class="avatar-usuario">
              <img src="https://ionicframework.com" alt="Jorge" />
            </ion-avatar>
            <ion-label class="nombre-usuario">Jorge</ion-label>
          </ion-item>
          <div class="contenedor-foto">
            <img src="https://picsum.photos" alt="Momento de Jorge" />
          </div>
        </ion-card>
      </ion-col>

      <!-- Tarjeta 3: Mario -->
      <ion-col size="6" size-md="3">
        <ion-card class="tarjeta-momento">
          <ion-item lines="none" class="cabecera-usuario">
            <ion-avatar slot="start" class="avatar-usuario">
              <img src="https://ionicframework.com" alt="Mario" />
            </ion-avatar>
            <ion-label class="nombre-usuario">Mario</ion-label>
          </ion-item>
          <div class="contenedor-foto">
            <img src="https://picsum.photos" alt="Momento de Mario" />
          </div>
        </ion-card>
      </ion-col>

      <!-- Tarjeta 4: Flavia -->
      <ion-col size="6" size-md="3">
        <ion-card class="tarjeta-momento">
          <ion-item lines="none" class="cabecera-usuario">
            <ion-avatar slot="start" class="avatar-usuario">
              <img src="https://ionicframework.com" alt="Flavia" />
            </ion-avatar>
            <ion-label class="nombre-usuario">Flavia</ion-label>
          </ion-item>
          <div class="contenedor-foto">
            <img src="https://picsum.photos" alt="Momento de Flavia" />
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
